# Fluentd Configuration for CDN Log Collection
# Optimized for high-throughput log ingestion to Google Cloud Pub/Sub

# Source: CDN Access Logs (Nginx format)
<source>
  @type tail
  path /var/log/nginx/access.log
  pos_file /var/log/fluentd/nginx.pos
  tag cdn.access
  
  <parse>
    @type nginx
    keep_time_key true
    time_format %d/%b/%Y:%H:%M:%S %z
  </parse>
  
  # Performance: lecture par chunks
  read_from_head false
  read_lines_limit 1000
  read_bytes_limit_per_second 0  # Pas de limite
  
  refresh_interval 5s
</source>

# Source: CDN Error Logs
<source>
  @type tail
  path /var/log/nginx/error.log
  pos_file /var/log/fluentd/nginx_error.pos
  tag cdn.error
  
  <parse>
    @type multiline
    format_firstline /^\d{4}/\d{2}/\d{2}/
    format1 /^(?<time>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?<log_level>\w+)\] (?<message>.*)/
  </parse>
</source>

# Filter: Enrichissement à la source
<filter cdn.access>
  @type record_transformer
  enable_ruby true
  
  <record>
    # Métadonnées infrastructure
    datacenter ${ENV['DATACENTER'] || 'unknown'}
    pop ${ENV['POP_ID'] || 'unknown'}
    server_id ${ENV['HOSTNAME']}
    
    # Timestamp processing
    processing_timestamp ${time.to_i}
    ingestion_latency_ms ${(Time.now.to_f - time.to_f) * 1000}
    
    # Parsing et normalisation
    response_time_ms ${record["request_time"] ? (record["request_time"].to_f * 1000).round(2) : 0}
    upstream_response_time_ms ${record["upstream_response_time"] ? (record["upstream_response_time"].to_f * 1000).round(2) : 0}
    
    # Status code normalization
    status_code ${record["status"]&.to_i || 0}
    is_error ${(record["status"]&.to_i || 0) >= 500 ? 1 : 0}
    is_client_error ${(record["status"]&.to_i || 0) >= 400 && (record["status"]&.to_i || 0) < 500 ? 1 : 0}
    
    # Cache status
    cache_status ${record["upstream_cache_status"] || record["http_x_cache_status"] || "UNKNOWN"}
    is_cache_hit ${(record["upstream_cache_status"] == "HIT" || record["http_x_cache_status"] == "HIT") ? 1 : 0}
    
    # Bytes
    bytes_sent ${record["body_bytes_sent"]&.to_i || 0}
    
    # Client info
    client_ip ${record["remote_addr"]}
    http_method ${record["request_method"]}
    http_protocol ${record["server_protocol"]}
  </record>
</filter>

# Filter: Sampling pour logs debug (optionnel - 10%)
<filter cdn.access>
  @type sampling_filter
  @id sampling_filter
  
  sample_rate 10
  interval 10
  
  tag cdn.access.sampled
</filter>

# Match: Output vers Google Cloud Pub/Sub
<match cdn.access>
  @type google_cloud_pubsub
  
  project #{ENV['GCP_PROJECT_ID']}
  topic cdn-logs-topic
  
  # Optimisation: compression et batching agressif
  compress gzip
  compression_level 6
  
  # Batching pour performance
  max_batch_size 1000
  max_batch_total_size 9437184  # 9 MB (limite Pub/Sub: 10MB)
  max_messages 1000
  
  # Buffer configuration pour haute disponibilité
  <buffer>
    @type file
    path /var/log/fluentd/buffer/pubsub
    
    # Flush settings
    flush_mode interval
    flush_interval 5s
    flush_at_shutdown true
    flush_thread_count 4
    
    # Chunk settings
    chunk_limit_size 8MB
    chunk_limit_records 10000
    total_limit_size 2GB
    
    # Overflow: supprimer les plus anciens
    overflow_action drop_oldest_chunk
    
    # Retry avec backoff exponentiel
    retry_type exponential_backoff
    retry_wait 1s
    retry_max_interval 30s
    retry_timeout 1h
    retry_max_times 10
    
    # Disable chunk keys pour meilleure performance
    disable_chunk_backup true
  </buffer>
  
  # Monitoring
  <inject>
    time_key event_time
    time_type string
    time_format %Y-%m-%dT%H:%M:%S.%NZ
    timezone UTC
  </inject>
</match>

# Match: Error logs vers topic séparé
<match cdn.error>
  @type google_cloud_pubsub
  
  project #{ENV['GCP_PROJECT_ID']}
  topic events-topic
  
  compress gzip
  
  <buffer>
    @type file
    path /var/log/fluentd/buffer/pubsub_errors
    flush_interval 10s
    chunk_limit_size 4MB
    total_limit_size 500MB
  </buffer>
</match>

# Métriques Fluentd (Prometheus)
<source>
  @type prometheus
  bind 0.0.0.0
  port 24231
  metrics_path /metrics
</source>

<source>
  @type prometheus_output_monitor
  interval 10
</source>

# Health check endpoint
<source>
  @type http
  bind 0.0.0.0
  port 8888
  body_size_limit 32m
  keepalive_timeout 10s
</source>
