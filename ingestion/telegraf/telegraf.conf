# Telegraf Configuration for Network Metrics Collection
# Collects network/system metrics and sends to Google Cloud Pub/Sub

[global_tags]
  datacenter = "$DATACENTER"
  pop = "$POP_ID"
  
[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "5s"
  precision = "1ms"
  hostname = "$HOSTNAME"
  omit_hostname = false

###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

# System CPU metrics
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = true
  core_tags = false

# Memory metrics
[[inputs.mem]]

# Disk I/O metrics
[[inputs.diskio]]
  devices = ["sda", "sdb", "nvme0n1"]

# Network interface metrics
[[inputs.net]]
  interfaces = ["eth0", "eth1"]
  ignore_protocol_stats = false

# Network statistics
[[inputs.netstat]]

# Network connections
[[inputs.conntrack]]
  files = ["ip_conntrack_count", "ip_conntrack_max"]
  dirs = ["/proc/sys/net/ipv4/netfilter", "/proc/sys/net/netfilter"]

# Nginx metrics (si disponible)
[[inputs.nginx]]
  urls = ["http://localhost/nginx_status"]
  response_timeout = "5s"

# System load
[[inputs.system]]
  fielddrop = ["uptime_format"]

# Kernel metrics
[[inputs.kernel]]

# Process monitoring
[[inputs.processes]]

# Ping checks vers origins
[[inputs.ping]]
  urls = ["origin1.example.com", "origin2.example.com"]
  count = 3
  ping_interval = 10.0
  timeout = 5.0
  method = "native"
  
# DNS query metrics
[[inputs.dns_query]]
  servers = ["8.8.8.8", "1.1.1.1"]
  domains = ["example.com"]
  record_type = "A"
  timeout = 2

# HTTP response metrics (health checks)
[[inputs.http_response]]
  urls = [
    "http://localhost/health",
    "https://origin.example.com/health"
  ]
  response_timeout = "5s"
  method = "GET"
  follow_redirects = false

###############################################################################
#                            PROCESSOR PLUGINS                                #
###############################################################################

# Add derived metrics
[[processors.converter]]
  [processors.converter.fields]
    float = ["*"]

# Rename fields for consistency
[[processors.rename]]
  [[processors.rename.replace]]
    field = "usage_idle"
    dest = "cpu_idle_pct"
  
  [[processors.rename.replace]]
    field = "usage_system"
    dest = "cpu_system_pct"
    
  [[processors.rename.replace]]
    field = "usage_user"
    dest = "cpu_user_pct"

###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################

# Output to Google Cloud Pub/Sub
[[outputs.cloud_pubsub]]
  project = "$GCP_PROJECT_ID"
  topic = "network-metrics-topic"
  
  ## Compression
  compression = "gzip"
  
  ## Batching
  batch_size = 1000
  
  ## Maximum publish request size in bytes
  max_message_size = 9437184  # 9 MB
  
  ## Attributes to add to each message
  [outputs.cloud_pubsub.attributes]
    source = "telegraf"
    version = "1.0"

# Output to local file for backup (optionnel)
[[outputs.file]]
  files = ["/var/log/telegraf/metrics.log"]
  rotation_max_size = "100MB"
  rotation_max_archives = 5
  data_format = "json"
  json_timestamp_units = "1ms"

# Prometheus output pour monitoring local
[[outputs.prometheus_client]]
  listen = ":9273"
  path = "/metrics"
  expiration_interval = "60s"
  collectors_exclude = ["gocollector", "process"]
  string_as_label = true
